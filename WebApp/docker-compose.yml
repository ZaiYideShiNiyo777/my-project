services:
  postgres:
    image: postgres:16-alpine
    container_name: trust-pg
    environment:
      POSTGRES_DB: trust_aggregator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: trust-redis
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: trust-api
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/trust_aggregator
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    # 容器启动后执行建表 + Seed（幂等）
    command: >
      sh -c "python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  web:
    image: nginx:alpine
    container_name: trust-web
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  pgdata:
